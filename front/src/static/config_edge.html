<script id="config_edge_main_form_script" type="text/plain">
    <form id='config_edge_main_form' action='' method='POST' onkeydown="return event.key != 'Enter';">
        <input type="hidden" id="edge_id" name="edge_id" value="\"\""/>
        <input type="hidden" id="net_guid" name="net_guid" value="\"\""/>
        <button id="config_edge_end_form" type="submit" style="display: none;"></button>
    </form>
</script>

<script id="config_edge_save_script" type="text/plain">
    <button id="config_edge_main_form_submit_button" type="submit" class="btn btn-success w-100">Сохранить</button>
</script>

<script id="config_edge_edpoint_script" type="text/plain">
    <div class="form-group pb-2">
        <label for="edge_source" class="text-sm">Из</label>
        <input type="text" class="form-control form-control-sm" id="edge_source" name="edge_source" value='' disabled>
    </div>

    <div class="form-group pb-2">
        <label for="edge_target" class="text-sm">В</label>
        <input type="text" class="form-control form-control-sm" id="edge_target" name="edge_target" value='' disabled>
    </div>
</script>

<script id="config_edge_set_network_issues_script" type="text/plain">
    <h6 id="edge_network_issues_title" class="text-sm mb-3">Настройка сетевых помех</h6>
    <label class="text-sm">Тип помехи</label>
    <select for="edge_issue_type" class="form-select form-select-sm" id="edge_issue_type" name="edge_issue_type">
        <option value="none">-</option>
        <option value="loss">Потеря пакетов</option>
        <option value="dup">Дублирование пакетов</option>
    </select>
    <div class="form-group pb-2" id="edge_issue_percentage_container" style="display: none;">
        <label for="edge_issue_percentage" class="text-sm" id="edge_issue_percentage_label">Интенсивность помех (%)</label>
        <input type="number"
               id="edge_issue_percentage"
               class="form-control form-control-sm"
               name="edge_issue_percentage"
               min="0"
               max="100"
               step="1"
               placeholder="0"
               oninput="this.value = this.value.replace(/[^0-9]/g, '');
                        this.value = Math.max(0, Math.min(100, parseInt(this.value) || 0));"
               value="{{ edge.data.issue_percentage }}">
    </div>
</script>
